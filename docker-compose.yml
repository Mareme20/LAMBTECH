
version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: meds_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-medsuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medspassword}
      POSTGRES_DB: ${DB_NAME:-meds_db}
    ports:
      - "5444:5432"
    volumes:
      - meds_db_data:/var/lib/postgresql/data

  backend:
    build: ./MEDS/backend
    container_name: meds_backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./MEDS/backend:/usr/src/app
      - ./MEDS/ia:/usr/src/app/ia:ro
      - /usr/src/app/node_modules
    environment:
      DATABASE_URL: postgresql://${DB_USER:-medsuser}:${DB_PASSWORD:-medspassword}@db:5432/${DB_NAME:-meds_db}
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      NODE_ENV: development
    command: npm run dev
    depends_on:
      - db

  ia:
    build: ./MEDS/ia
    container_name: meds_ia
    restart: always
    volumes:
      - ./MEDS/ia:/usr/src/app/ia
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USER:-medsuser}
      DB_PASSWORD: ${DB_PASSWORD:-medspassword}
      DB_NAME: ${DB_NAME:-meds_db}
    depends_on:
      - db

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: meds_elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - meds_elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: meds_kibana
    restart: always
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "5601:5601"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: meds_grafana
    restart: always
    depends_on:
      - elasticsearch
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3000:3000"

  log-shipper:
    image: fluent/fluent-bit:2.2.0


    container_name: meds_fluentbit
    restart: always
    depends_on:
      - elasticsearch
    volumes:
      - ./MEDS/logging/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./MEDS/logging/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200


volumes:
  meds_db_data:
  meds_elasticsearch_data:

