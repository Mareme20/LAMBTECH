[SERVICE]
    Flush        1
    Log_Level    info

[INPUT]
    Name              tail
    Tag               docker.backend
    Path              /var/lib/docker/containers/*/*-json.log
    Exclude_Path      /var/lib/docker/containers/*/*-json.log
    Docker_Mode       On
    Refresh_Interval 5

[FILTER]
    Name parser
    Match docker.*
    Key_Name log
    Parser json

[OUTPUT]
    Name  es
    Match *
    Host  elasticsearch
    Port  9200
    Index logs-meds
    Type  _doc
    Logstash_Format On
    Retry_Limit False

